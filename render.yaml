services:
  - type: web
    name: portfolio-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://your-netlify-domain.netlify.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        fromService:
          name: portfolio-backend
          property: env.SMTP_USER
      - key: SMTP_PASS
        fromService:
          name: portfolio-backend
          property: env.SMTP_PASS
      - key: SMTP_FROM
        fromService:
          name: portfolio-backend
          property: env.SMTP_FROM
      - key: SMTP_TO
        fromService:
          name: portfolio-backend
          property: env.SMTP_TO
